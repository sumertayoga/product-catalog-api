name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs so a re-pointed tag can't inject code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore ProductCatalog.sln
      - run: dotnet build ProductCatalog.sln -c Release --no-restore
      - run: dotnet test --solution ProductCatalog.sln -c Release --no-build

      - name: Check for vulnerable packages
        run: |
          dotnet list ProductCatalog.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
